# Managed component dependencies (pulled by the IDF Component Manager on build).
#
# Anything that names a panel, a touch controller or a codec carries a `rules:` target guard — the two
# boards share this file, and a driver built for the other one's silicon is at best dead weight and at
# worst a build that will not configure (esp_lcd_co5300 does not claim esp32p4 at all).
dependencies:
  idf:
    version: ">=5.5.0"
  # LVGL v9 graphics library.
  # "~9.5.0", not "^9.2.0": the caret took any 9.x, and LVGL 9.6.0 (registry, 2026-09-16) tightened
  # the TLSF pool limit so the 512 KiB PSRAM pool below is refused and the firmware aborts at boot. The
  # lock that pinned 9.5.0 was gitignored, so every fresh checkout — a clone, CI, a worktree — resolved to
  # 9.6.0 and built a dial that boot-looped. Moving to 9.6 is a deliberate change to the pool setup, not
  # something a fresh build should do on its own.
  lvgl/lvgl: "~9.5.0"
  # Official CO5300 AMOLED panel driver (the controller on this board).
  espressif/esp_lcd_co5300:
    version: "*"
    rules:
      - if: "target in [esp32s3]"
  # Capacitive touch → LVGL pointer indev for swipe. BOTH controllers are linked in: the two dials
  # that ship differ here (CST9217 on one, CST816S on the other) and one image serves both — the
  # board is detected at boot (board/board.c) and the matching driver is opened. Pulls esp_lcd_touch.
  waveshare/esp_lcd_touch_cst9217:
    version: "*"
    rules:
      - if: "target in [esp32s3]"
  espressif/esp_lcd_touch_cst816s:
    version: "^1.1.2"
    rules:
      - if: "target in [esp32s3]"
  # Audio codec abstraction + ES7210 (ADC/mic) + ES8311 drivers for mic capture. NO target rule: both
  # boards carry the same two codecs, which is the one piece of the dial's hardware the Pro repeats
  # exactly — so audio_capture.c compiles for both with nothing but a different pin map.
  espressif/esp_codec_dev: "*"
  # WebSocket client used by commander_client.c. Pinned below 1.3.0: newer
  # releases call esp_transport_ws_get_redir_uri(), which this IDF 5.5's
  # tcp_transport does not provide (no HTTP-redirect support).
  espressif/esp_websocket_client:
    version: "~1.2.0"
    rules:
      - if: "target in [esp32s3]"
  # libsodium — the E2EE crypto stack (Ed25519, X25519, ristretto255 CPace, ChaCha20-Poly1305,
  # SHA-2, HKDF/HMAC). Backs devices/harness-device/firmware/main/e2ee/e2ee_core.c (byte-identical twin of the web/adapter
  # TS core). The Espressif port wires randombytes to the hardware RNG. See e2ee_core.h.
  espressif/libsodium:
    version: "^1.0.20"
    rules:
      - if: "target in [esp32s3]"

  # ── Harness Pro (ESP32-P4) ────────────────────────────────────────────────────────────────────────
  # The panel driver carries everything the vendor BSP would have given us and that we cannot derive
  # ourselves: the ST7703's power-on register sequence, and the DSI timings for THIS panel —
  # ST7703_720_720_PANEL_60HZ_DPI_CONFIG (38 MHz pixel clock, porches 50/20/50 by 20/4/20) and
  # ST7703_PANEL_BUS_DSI_2CH_CONFIG (2 lanes at 480 Mbps). It is published for esp32p4 only.
  waveshare/esp_lcd_st7703:
    version: "^2.0.0"
    rules:
      - if: "target in [esp32p4]"
  # GT911 → LVGL pointer indev. Its reset is done BY HAND in board/pro_bringup.c before this driver is
  # opened, because the chip decides its own I2C address from the INT pin at the rising edge of RESET —
  # so the driver is always given GPIO_NUM_NC and must never be allowed to pulse it again.
  espressif/esp_lcd_touch_gt911:
    version: "^1.1.0"
    rules:
      - if: "target in [esp32p4]"
